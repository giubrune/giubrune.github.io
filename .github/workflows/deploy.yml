name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily rebuild to refresh the Calabria soil-moisture map (04:23 UTC ≈ 05:23/06:23 in Italy)
    - cron: "23 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Repository must be named <username>.github.io; set a custom domain here if you add one.
      SITE_URL: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Keep the last good soil-moisture snapshot in case today's download fails
      - name: Restore previous soil-moisture data
        uses: actions/cache/restore@v4
        with:
          path: src/data/generated
          key: soil-moisture-${{ github.run_id }}
          restore-keys: soil-moisture-
      - name: Download soil moisture (Open-Meteo)
        id: soil
        continue-on-error: true
        run: npm run fetch:soil
      - name: Save soil-moisture data
        if: steps.soil.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: src/data/generated
          key: soil-moisture-${{ github.run_id }}

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
